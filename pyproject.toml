[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-arena"
version = "0.1.0"
description = "Workload-centric benchmarks for agent sandboxes"
requires-python = ">=3.10"

[project.scripts]
arena = "arena.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

